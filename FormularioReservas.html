    <h1 class="mb-4">Reserva tu mesa</h1>

    <div class="reserva-wrapper">
        <form id="formReserva" class="row g-3" action="reservar.php" method="POST">
    <div class="col-md-6">
        <label for="nombreReserva" class="form-label">Nombre</label>
        <input type="text" id="nombreReserva" name="nombre" class="form-control" required>
    </div>
        <div class="col-md-6">
            <label for="fecha" class="form-label">Fecha</label>
            <input type="date" id="fecha" name="fecha" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="hora" class="form-label">Hora</label>
            <input type="time" id="hora" name="hora" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="personas" class="form-label">Número de personas</label>
            <input type="number" id="personas" name="personas" class="form-control" min="1" max="10" required>
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label for="mesa" class="form-label">Tipo de mesa</label>
            <select id="mesa" name="mesa" class="form-select">
                <option value="1">VIP</option>
                <option value="2">Terraza</option>
                <option value="3">Interior</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="notas" class="form-label">Notas</label>
            <textarea id="notas" name="notas" class="form-control" rows="2" placeholder="Observaciones"></textarea>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Reservar</button>
        </div>
        </form>
    </div>

    <div id="notificacion" class="alert mt-3 d-none"></div>
